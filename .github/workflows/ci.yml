name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : la CI lit le dépôt, elle n'écrit rien.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mêmes étapes, dans le même ordre, que `npm run ci` (vérifié par
      # tests/scripts/ci-workflow.test.mjs).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:neutralite
      # Failles graves dans les dépendances livrées aux utilisateurs.
      - run: npm run audit
      - run: npm run test:coverage
      - run: npm run build
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
