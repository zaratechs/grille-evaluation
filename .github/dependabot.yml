# Mises à jour encadrées : une demande de fusion par mois, vérifiée par la CI, fusionnée
# par Réda. Voir la section « Maintenance » du README.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Mineures et correctifs ensemble ; chaque version majeure arrive seule.
      mineures-et-correctifs:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
